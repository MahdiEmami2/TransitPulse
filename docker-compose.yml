services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transitpulse
      POSTGRES_PASSWORD: transitpulse
      POSTGRES_DB: transitpulse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://transitpulse:transitpulse@db:5432/transitpulse
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
