[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transitpulse"
version = "0.1.0"
description = "TransitPulse - Public transport delay analysis and prediction"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "TransitPulse Team" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.35",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29,<0.31",
    "psycopg2-binary>=2.9,<3.0",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "pandas>=2.2,<2.3",
    "scikit-learn>=1.5,<1.6",
    "numpy>=1.26,<2",
    "python-multipart>=0.0.12,<0.0.20",
    "python-jose[cryptography]>=3.3,<4",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<0.7",
    "mypy>=1.10,<2",
    "pre-commit>=3.5,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["transitpulse*"]

[tool.setuptools.package-data]
transitpulse = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true